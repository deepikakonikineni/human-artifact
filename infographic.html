<!DOCTYPE html>
<html>
  <head>
    <title>Used, But Hidden</title>
    <style>
  #hiddenStat {
    display: none;
  }
</style>
  </head>
  <body>
    <h1>58%</h1>
    <p>of employees worldwide say they intentionally use AI at work.</p>
    <p id="hiddenStat">57% of those employees say they hide their AI use and present the work as their own.</p>
    <button onclick="document.getElementById('hiddenStat').style.display = 'block';">Reveal who hides it</button>
  </body>
</html>
